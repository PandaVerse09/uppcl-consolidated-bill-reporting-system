name: CD - Build & Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            FRONTEND/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: FRONTEND
        run: npm ci

      - name: Build Frontend
        working-directory: FRONTEND
        run: npm run build

      - name: Copy Static Assets to Backend
        run: |
          rm -rf BACKEND/dist
          cp -r FRONTEND/dist BACKEND/dist

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          file: ./BACKEND/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uppcl-drmp:latest

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uppcl-drmp:latest
            
            # Stop and remove existing container if running
            docker stop uppcl-drmp || true
            docker rm uppcl-drmp || true
            
            # Run the new container
            docker run -d \
              --name uppcl-drmp \
              --restart always \
              --env-file ~/uppcl-drmp/.env \
              -p 5000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/uppcl-drmp:latest
